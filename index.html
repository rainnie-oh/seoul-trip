<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>首尔 4天3晚 · 抱石·买手街区·美食漫游攻略</title>
<meta name="description" content="首尔 4 天 3 晚专属旅游攻略：Naver 官方封面实拍、全候选餐厅地图精确定位、营业时间与 CatchTable 预约指南">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
/* ═══════════════════════════════════════════
   Design Tokens — Clean, Photo-First Travel Guide
   ═══════════════════════════════════════════ */
:root {
  --primary:        #ff385c; /* Airbnb Rausch Accent */
  --primary-hover:  #e00b41;
  --primary-light:  #fff0f2;
  --ink:            #222222;
  --body:           #484848;
  --muted:          #717171;
  --hairline:       #ebebeb;
  --hairline-dark:  #dddddd;
  --canvas:         #ffffff;
  --surface-soft:   #f7f7f7;
  --shadow-card:    rgba(0,0,0,0.04) 0 1px 3px 0, rgba(0,0,0,0.06) 0 4px 12px 0;
  --shadow-hover:   rgba(0,0,0,0.08) 0 6px 20px 0, rgba(0,0,0,0.12) 0 10px 28px 0;
  --shadow-floating: 0 6px 24px rgba(0,0,0,0.25), 0 1px 4px rgba(0,0,0,0.12);
  --radius-sm:      8px;
  --radius-md:      14px;
  --radius-lg:      18px;
  --radius-full:    9999px;
  --font-stack:     -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --safe-bottom:    env(safe-area-inset-bottom, 0px);
  --safe-top:       env(safe-area-inset-top, 0px);
  --header-height-mobile: 98px;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%;
  min-height: 100%;
}
body {
  font-family: var(--font-stack);
  background: var(--canvas);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  line-height: 1.45;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; }

/* ── Clean Travel Header (Airbnb Style) ── */
.app-header {
  position: sticky; top: 0; z-index: 1000;
  background: #ffffff;
  border-bottom: 1px solid var(--hairline);
  box-shadow: 0 2px 8px rgba(0,0,0,0.03);
  transition: all 0.2s ease;
}
.header-top {
  max-width: 1320px; margin: 0 auto;
  padding: 14px 20px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
}
.trip-title-group h1 {
  font-size: 20px; font-weight: 800; color: var(--ink); letter-spacing: -0.4px;
  display: flex; align-items: center; gap: 8px;
}
.trip-title-group .trip-dates {
  font-size: 13px; font-weight: 600; color: var(--muted); margin-top: 2px;
}

/* Flight & Basecamp Summary Badges */
.header-meta-group {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.meta-chip {
  background: var(--surface-soft); border: 1px solid var(--hairline);
  border-radius: var(--radius-full); padding: 5px 12px;
  font-size: 12px; font-weight: 600; color: var(--body);
  display: flex; align-items: center; gap: 6px;
  white-space: nowrap; flex-shrink: 0;
}
.meta-chip b { color: var(--ink); }

/* ── Day Navigation Strip (Horizontal Swiper on Mobile) ── */
.nav-strip-wrapper {
  background: #ffffff;
  border-top: 1px solid var(--hairline);
  position: relative;
}
.nav-strip {
  max-width: 1320px; margin: 0 auto;
  display: flex; gap: 10px; padding: 10px 20px;
  overflow-x: auto; scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  scroll-behavior: smooth;
}
.nav-strip::-webkit-scrollbar { display: none; }
.nav-tab {
  display: flex; align-items: center; gap: 6px;
  background: var(--surface-soft); border: 1px solid var(--hairline);
  border-radius: var(--radius-full); padding: 8px 16px;
  font-size: 13px; font-weight: 700;
  color: var(--muted); cursor: pointer; white-space: nowrap;
  transition: all 0.18s ease;
  flex-shrink: 0;
}
.nav-tab:hover { background: #ebebeb; color: var(--ink); }
.nav-tab.active {
  background: var(--ink); color: #ffffff;
  border-color: var(--ink);
  box-shadow: 0 2px 8px rgba(0,0,0,0.12);
}
.nav-tab.active .tab-icon { transform: scale(1.1); }

/* ── Main Layout: Listing Feed + Sticky Map (Desktop Default) ── */
.main-wrapper {
  max-width: 1320px; margin: 0 auto;
  padding: 20px;
  display: grid; grid-template-columns: 1fr 480px; gap: 28px;
  min-height: calc(100vh - 130px);
}

/* ── Sticky Map Container (Desktop) ── */
#map-container {
  position: sticky; top: 124px; height: calc(100vh - 150px);
  border-radius: var(--radius-md); overflow: hidden;
  border: 1px solid var(--hairline);
  box-shadow: var(--shadow-card);
  background: #eef2f6;
}
#map { width: 100%; height: 100%; }

/* Mobile Map Toggle Floating Button (Hidden on Desktop) */
.mobile-map-toggle {
  display: none;
}

/* Mobile Floating Map Preview Card (Hidden on Desktop) */
.mobile-map-card {
  display: none;
}

/* ── Feed Section ── */
.feed-header { margin-bottom: 20px; }
.feed-header h2 { font-size: 22px; font-weight: 800; color: var(--ink); letter-spacing: -0.3px; }
.feed-header p { font-size: 14px; color: var(--muted); margin-top: 4px; }

.feed-list { display: flex; flex-direction: column; gap: 20px; }

/* ── Spot Card (Photo-First & Directly Clickable) ── */
.spot-card {
  background: #ffffff;
  border-radius: var(--radius-md);
  border: 1px solid var(--hairline);
  box-shadow: var(--shadow-card);
  overflow: hidden;
  transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
}
.spot-card.clickable {
  cursor: pointer;
}
.spot-card.clickable:hover {
  box-shadow: var(--shadow-hover);
  transform: translateY(-2px);
  border-color: #c7d2fe;
}
.spot-card.clickable:active {
  transform: scale(0.995);
}

/* Card Photo Banner */
.card-media {
  position: relative; width: 100%; height: 230px;
  background: #f0f0f0; overflow: hidden;
}
.card-media img {
  width: 100%; height: 100%; object-fit: cover;
  transition: transform 0.35s ease;
}
.spot-card.clickable:hover .card-media img {
  transform: scale(1.03);
}

/* Badges over photo */
.badge-float-left {
  position: absolute; top: 14px; left: 14px;
  background: rgba(255,255,255,0.96); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  padding: 4px 12px; border-radius: var(--radius-full);
  font-size: 12px; font-weight: 700; color: var(--ink);
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  display: flex; align-items: center; gap: 4px;
  z-index: 2;
}
.badge-float-left.highlight {
  background: #fff8e6; color: #b78103; border: 1px solid #ffe58f;
}
.time-pill-float {
  position: absolute; bottom: 12px; left: 14px;
  background: rgba(34,34,34,0.88); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  color: #fff; font-size: 12px; font-weight: 700;
  padding: 4px 10px; border-radius: 6px;
  z-index: 2;
}

/* Card Body */
.card-body { padding: 18px; }

.card-title-row {
  display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
}
.card-title {
  font-size: 18px; font-weight: 800; color: var(--ink); line-height: 1.3;
}
.card-kor-name {
  font-size: 13px; font-weight: 600; color: var(--muted); margin-top: 2px;
}
.card-address {
  font-size: 12px; color: var(--muted); margin-top: 4px;
  display: flex; align-items: center; gap: 4px;
}

/* Meta Pills */
.meta-pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
.pill {
  font-size: 12px; font-weight: 600; padding: 4px 10px;
  border-radius: 6px; display: inline-flex; align-items: center; gap: 4px;
}
.pill.transit { background: #f0f5ff; color: #007aff; }
.pill.hours   { background: #f6ffed; color: #389e0d; border: 1px solid #d9f7be; }
.pill.reserve { background: #fff0f0; color: #e02020; border: 1px solid #ffccc7; }

.card-desc {
  font-size: 13.5px; color: var(--body); line-height: 1.5; margin-top: 8px;
}

/* ── Meal Candidate Options ── */
.meal-section {
  margin-top: 14px; border-top: 1px solid var(--hairline); padding-top: 14px;
}
.meal-section-head {
  font-size: 13px; font-weight: 800; color: var(--ink); text-transform: uppercase;
  letter-spacing: 0.5px; margin-bottom: 10px; display: flex; justify-content: space-between;
}
.meal-cards-list { display: flex; flex-direction: column; gap: 10px; }

.meal-item {
  background: #ffffff; border-radius: var(--radius-sm);
  padding: 12px 14px; border: 1px solid var(--hairline);
  display: flex; gap: 14px; align-items: flex-start;
  transition: all 0.15s ease;
  cursor: pointer;
}
.meal-item:hover {
  background: #ffffff;
  border-color: #94a3b8;
  box-shadow: 0 4px 14px rgba(0,0,0,0.06);
  transform: translateY(-1px);
}
.meal-item:active {
  transform: scale(0.99);
}
.meal-item.top-rank {
  background: #fafafa;
  border: 1px solid #e2e8f0;
}
.meal-item.top-rank:hover {
  background: #ffffff;
  border-color: #007aff;
}
.meal-item-thumb {
  width: 84px; height: 84px; border-radius: 8px; object-fit: cover;
  background: #eee; flex-shrink: 0;
}
.meal-item-content { flex: 1; min-width: 0; }
.meal-name-row {
  display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 4px;
}
.meal-name { font-size: 15px; font-weight: 800; color: var(--ink); }
.meal-score { font-size: 12px; font-weight: 800; color: var(--primary); }
.meal-address { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.meal-memo { font-size: 13px; color: var(--body); margin-top: 4px; line-height: 1.4; }
.meal-meta-row {
  font-size: 11.5px; color: var(--muted); margin-top: 6px;
  display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
}
.meal-actions-row {
  display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap;
}

/* Button Styles */
.btn-rausch {
  padding: 6px 14px; border-radius: 6px;
  background: var(--primary); color: #fff;
  font-size: 12px; font-weight: 700;
  border: none; cursor: pointer; text-align: center;
  display: inline-flex; align-items: center; gap: 4px;
  transition: background 0.15s ease, transform 0.1s ease;
}
.btn-rausch:hover { background: var(--primary-hover); }
.btn-rausch:active { transform: scale(0.97); }

.btn-outline {
  padding: 6px 14px; border-radius: 6px;
  background: #fff; color: var(--ink);
  font-size: 12px; font-weight: 700;
  border: 1px solid #c7c7c7; cursor: pointer; text-align: center;
  display: inline-flex; align-items: center; gap: 4px;
  transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
}
.btn-outline:hover { background: #f0f0f0; border-color: var(--ink); }
.btn-outline:active { transform: scale(0.97); }

/* Card Footer Actions */
.card-bottom-actions {
  display: flex; gap: 8px; margin-top: 14px; padding-top: 12px;
  border-top: 1px solid var(--hairline); flex-wrap: wrap;
}

/* Overview Stat Cards */
.overview-stats {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 24px;
}
.stat-box {
  background: #ffffff; border: 1px solid var(--hairline);
  border-radius: var(--radius-md); padding: 16px; box-shadow: var(--shadow-card);
}
.stat-box .stat-label { font-size: 11.5px; font-weight: 800; color: var(--muted); text-transform: uppercase; }
.stat-box .stat-val { font-size: 15px; font-weight: 800; color: var(--ink); margin-top: 6px; }
.stat-box .stat-sub { font-size: 12.5px; color: var(--muted); margin-top: 4px; line-height: 1.4; }

/* ── Route Arrows & Directional Path Styling ── */
.route-arrow-wrap {
  pointer-events: none;
}
.route-arrow {
  width: 22px; height: 22px;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 900;
  text-shadow: 0 0 4px #ffffff, 0 0 6px #ffffff, 0 1px 3px rgba(0,0,0,0.3);
  line-height: 1;
}

/* ── Custom Leaflet Map Pin Style with Sequence Number ── */
.map-pill-pin {
  background: #ffffff; color: var(--ink);
  font-weight: 800; font-size: 11.5px;
  padding: 4px 9px 4px 5px; border-radius: 20px;
  border: 1px solid rgba(0,0,0,0.15);
  box-shadow: 0 2px 8px rgba(0,0,0,0.14);
  white-space: nowrap; cursor: pointer;
  transition: transform 0.15s, background 0.15s, color 0.15s, box-shadow 0.15s;
  display: inline-flex; align-items: center; gap: 5px;
}
.map-pill-pin:hover, .map-pill-pin.active {
  background: var(--ink); color: #ffffff;
  transform: scale(1.1); z-index: 1000;
  box-shadow: 0 4px 14px rgba(0,0,0,0.25);
}
.map-pill-pin.rausch {
  background: var(--primary); color: #ffffff; border: none;
}
.map-pill-pin.candidate {
  background: #fff8e6; color: #b78103; border: 1px solid #ffe58f;
  padding: 4px 8px;
}
.map-pill-pin .seq-num {
  width: 17px; height: 17px; border-radius: 50%;
  background: var(--ink); color: #ffffff;
  font-size: 10px; font-weight: 800;
  display: inline-flex; align-items: center; justify-content: center;
  flex-shrink: 0; line-height: 1;
}
.map-pill-pin.rausch .seq-num {
  background: #ffffff; color: var(--primary);
}
.map-pill-pin:hover .seq-num {
  background: #ffffff; color: var(--ink);
}

/* ═══════════════════════════════════════════
   Airbnb Mobile & Tablet Adaptation (<= 1024px)
   ═══════════════════════════════════════════ */
@media (max-width: 1024px) {
  /* Compact Header */
  .header-top {
    padding: 10px 14px;
    gap: 8px;
    flex-direction: column;
    align-items: flex-start;
  }
  .trip-title-group h1 {
    font-size: 16px;
    letter-spacing: -0.3px;
    gap: 6px;
  }
  .trip-title-group .trip-dates {
    font-size: 11.5px;
    margin-top: 1px;
  }

  /* Horizontal Scrolling Meta Badges Strip */
  .header-meta-group {
    width: 100%;
    overflow-x: auto;
    flex-wrap: nowrap;
    gap: 6px;
    padding-bottom: 2px;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .header-meta-group::-webkit-scrollbar { display: none; }
  .meta-chip {
    padding: 4px 10px;
    font-size: 11px;
    border-radius: var(--radius-full);
  }

  /* Day Nav Strip */
  .nav-strip {
    padding: 8px 14px;
    gap: 8px;
  }
  .nav-tab {
    padding: 7px 14px;
    font-size: 12.5px;
  }

  /* Mobile Page Layout */
  .main-wrapper {
    display: block;
    padding: 12px 14px calc(80px + var(--safe-bottom)) 14px;
    min-height: auto;
  }

  .feed-header {
    margin-bottom: 14px;
  }
  .feed-header h2 {
    font-size: 18px;
  }
  .feed-header p {
    font-size: 12.5px;
  }

  /* Stat Overview in Mobile */
  .overview-stats {
    grid-template-columns: 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }
  .stat-box {
    padding: 12px 14px;
  }
  .stat-box .stat-val {
    font-size: 14px;
  }

  /* Spot Cards in Mobile */
  .card-media {
    height: 190px;
  }
  .card-body {
    padding: 14px;
  }
  .card-title {
    font-size: 16.5px;
  }
  .card-desc {
    font-size: 13px;
  }

  /* Meal items in Mobile */
  .meal-item {
    padding: 10px 12px;
    gap: 10px;
  }
  .meal-item-thumb {
    width: 74px;
    height: 74px;
  }
  .meal-name {
    font-size: 14px;
  }
  .meal-memo {
    font-size: 12.5px;
  }
  .btn-rausch, .btn-outline {
    padding: 7px 12px;
    font-size: 11.5px;
    min-height: 34px;
  }

  /* ── Airbnb Mobile Map Switcher ── */
  #map-container {
    display: none;
  }

  /* Mobile Fullscreen Map Mode */
  body.mobile-map-active {
    overflow: hidden;
    height: 100vh;
  }
  body.mobile-map-active .feed-column {
    display: none;
  }
  body.mobile-map-active #map-container {
    display: block;
    position: fixed;
    top: var(--header-height-mobile);
    left: 0;
    right: 0;
    bottom: 0;
    width: 100vw;
    height: calc(100vh - var(--header-height-mobile));
    z-index: 900;
    border-radius: 0;
    border: none;
    box-shadow: none;
  }

  /* Airbnb Floating Pill Switcher Button */
  .mobile-map-toggle {
    display: flex;
    position: fixed;
    bottom: calc(20px + var(--safe-bottom));
    left: 50%;
    transform: translateX(-50%);
    background: #222222;
    color: #ffffff;
    padding: 11px 22px;
    border-radius: var(--radius-full);
    font-size: 13.5px;
    font-weight: 700;
    box-shadow: var(--shadow-floating);
    z-index: 1100;
    cursor: pointer;
    align-items: center;
    gap: 8px;
    transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    border: 1px solid rgba(255,255,255,0.18);
    user-select: none;
  }
  .mobile-map-toggle:hover {
    background: #000000;
  }
  .mobile-map-toggle:active {
    transform: translateX(-50%) scale(0.95);
    background: #000000;
  }

  /* Mobile Map Bottom Preview Card (Tapping Pin Pops up Card) */
  .mobile-map-card {
    display: none;
    position: fixed;
    bottom: calc(76px + var(--safe-bottom));
    left: 12px;
    right: 12px;
    max-width: 480px;
    margin: 0 auto;
    background: #ffffff;
    border-radius: var(--radius-md);
    padding: 12px 14px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.25);
    border: 1px solid var(--hairline);
    z-index: 1050;
    animation: mobileCardSlideUp 0.22s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .mobile-map-card.show {
    display: block;
  }
  .mobile-map-card-close {
    position: absolute;
    top: 10px;
    right: 12px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--surface-soft);
    border: 1px solid var(--hairline);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    z-index: 3;
  }
  .mobile-map-card-body {
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .mobile-map-card-img {
    width: 72px;
    height: 72px;
    border-radius: 8px;
    object-fit: cover;
    background: #f0f0f0;
    flex-shrink: 0;
  }
  .mobile-map-card-info {
    flex: 1;
    min-width: 0;
  }
  .mobile-map-card-title {
    font-size: 14.5px;
    font-weight: 800;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .mobile-map-card-sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .mobile-map-card-actions {
    display: flex;
    gap: 8px;
    margin-top: 6px;
  }
}

@keyframes mobileCardSlideUp {
  from {
    transform: translateY(24px);
    opacity: 0;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}
</style>
</head>
<body>

<!-- ── Clean Travel Header ── -->
<header class="app-header">
  <div class="header-top">
    <div class="trip-title-group">
      <h1>🧗 首尔 4天3晚 · 抱石·买手街区·美食漫游攻略</h1>
      <div class="trip-dates">📅 2026年9月12日 (周六) ~ 9月15日 (周二) · 2天抱石 + 2天街区漫游</div>
    </div>
    <div class="header-meta-group">
      <div class="meta-chip">✈️ 去程 <b>9/12(六) 14:00 GMP (OZ3625)</b></div>
      <div class="meta-chip">✈️ 返程 <b>9/15(二) 20:00 ICN (OZ367)</b></div>
      <div class="meta-chip">🏨 宿 <b>钟路三街 The Square Hostel</b></div>
    </div>
  </div>

  <!-- Day Navigation Strip -->
  <div class="nav-strip-wrapper">
    <div class="nav-strip" id="navStrip">
      <button class="nav-tab active" onclick="switchDay(0)">
        <span class="tab-icon">🧭</span>
        <span>行程总览</span>
      </button>
      <button class="nav-tab" onclick="switchDay(1)">
        <span class="tab-icon">🧗</span>

/* ═══════════════════════════════════════════
   Leaflet Map Controller with Dynamic Route & Directional Arrows
   ═══════════════════════════════════════════ */
let map;
let markerLayer;
let routeLayer;
let currentMarkers = {};

function initMap() {
  map = L.map('map', {
    zoomControl: true,
    attributionControl: false
  }).setView([37.565, 126.985], 13);

  // High-clarity clean CartoDB Voyager tiles
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    maxZoom: 19
  }).addTo(map);

  routeLayer = L.featureGroup().addTo(map);
  markerLayer = L.featureGroup().addTo(map);
}

function drawRouteWithArrows(latlngs, color) {
  if (!latlngs || latlngs.length < 2) return;

  // Background smooth glow halo
  L.polyline(latlngs, {
    color: color,
    weight: 6,
    opacity: 0.22,
    lineCap: 'round',
    lineJoin: 'round'
  }).addTo(routeLayer);

  // Main dashed route line
  L.polyline(latlngs, {
    color: color,
    weight: 3.5,
    opacity: 0.9,
    dashArray: '6, 6',
    lineCap: 'round',
    lineJoin: 'round'
  }).addTo(routeLayer);

  // Directional arrows along each segment
  for (let i = 0; i < latlngs.length - 1; i++) {
    const p1 = latlngs[i];
    const p2 = latlngs[i + 1];
    const midLat = (p1[0] + p2[0]) / 2;
    const midLng = (p1[1] + p2[1]) / 2;
    const dLng = p2[1] - p1[1];
    const dLat = p2[0] - p1[0];
    if (Math.abs(dLng) < 0.00001 && Math.abs(dLat) < 0.00001) continue;

    // Mercator aspect ratio compensation at ~37.5 deg N: cos(37.5) ≈ 0.793
    const angle = (Math.atan2(dLng * 0.793, dLat) * 180 / Math.PI + 360) % 360;

    const arrowIcon = L.divIcon({
      className: 'route-arrow-wrap',
      html: `<div class="route-arrow" style="transform: rotate(${angle - 90}deg); color: ${color};">➤</div>`,
      iconSize: [22, 22],
      iconAnchor: [11, 11]
    });
    L.marker([midLat, midLng], { icon: arrowIcon, interactive: false }).addTo(routeLayer);
  }
}

function renderMapMarkers(dayId) {
  if (!markerLayer || !routeLayer) return;
  markerLayer.clearLayers();
  routeLayer.clearLayers();
  currentMarkers = {};

  let bounds = [];

  if (dayId === 0) {
    // Overview: Draw connected routes for all 4 days
    for (let i = 1; i < ITINERARY_DAYS.length; i++) {
      const d = ITINERARY_DAYS[i];
      const dColor = d.color || '#ff385c';
      const dPoints = [];

      d.spots.forEach((spot, idx) => {
        if (!spot.lat || !spot.lng) return;
        dPoints.push([spot.lat, spot.lng]);
        bounds.push([spot.lat, spot.lng]);

        let label = spot.shortName || spot.name.split(' ')[0].split('(')[0];

        const customIcon = L.divIcon({
          className: 'custom-pin-wrap',
          html: `<div class="map-pill-pin"><span class="seq-num" style="background:${dColor};">${idx + 1}</span>${label}</div>`,
          iconSize: [96, 26],
          iconAnchor: [48, 13]
        });

        const marker = L.marker([spot.lat, spot.lng], { icon: customIcon });
        marker.bindPopup(`
          <div style="font-family:var(--font-stack);font-size:13px;max-width:220px;padding:4px;">
            ${spot.img ? `<img src="${spot.img}" style="width:100%;height:100px;object-fit:cover;border-radius:6px;margin-bottom:6px;" alt="${spot.name}"/>` : ''}
            <b style="font-size:14px;color:var(--ink);display:block;">${spot.name}</b>
            <div style="color:var(--muted);font-size:11.5px;margin:2px 0;">${spot.address || spot.kor || ''}</div>
            ${spot.time ? `<div style="font-size:11.5px;color:var(--body);margin-top:2px;">🕒 ${spot.time}</div>` : ''}
            ${spot.naverUrl ? `<div style="margin-top:6px;"><a href="${spot.naverUrl}" target="_blank" style="color:#007aff;font-weight:700;font-size:12px;">在 Naver Map 打开导航 →</a></div>` : ''}
          </div>
        `);
        marker.on('click', () => {
          if (window.innerWidth <= 1024) {
            showMobileMapCard(spot);
          }
        });
        markerLayer.addLayer(marker);
        currentMarkers[spot.name] = marker;
      });

      drawRouteWithArrows(dPoints, dColor);
    }
  } else {
    // Single Day View: Clean linear path + Candidate Restaurant sub-pins
    const d = ITINERARY_DAYS.find(x => x.id === dayId);
    if (d && d.spots) {
      const dColor = d.color || '#ff385c';
      const mainRoutePoints = [];

      d.spots.forEach((spot, idx) => {
        if (!spot.lat || !spot.lng) return;

        mainRoutePoints.push([spot.lat, spot.lng]);
        bounds.push([spot.lat, spot.lng]);

        const isHighlight = spot.badge && (spot.badge.includes('岩馆') || spot.badge.includes('必买') || spot.badge.includes('必逛') || spot.badge.includes('🥇'));
        let pillClass = 'map-pill-pin';
        if (isHighlight) pillClass += ' rausch';

        let label = spot.shortName || spot.name.split(' ')[0].split('(')[0];

        const customIcon = L.divIcon({
          className: 'custom-pin-wrap',
          html: `<div class="${pillClass}"><span class="seq-num" style="${isHighlight ? 'background:#fff;color:var(--primary);' : `background:${dColor};`}">${idx + 1}</span>${label}</div>`,
          iconSize: [98, 26],
          iconAnchor: [49, 13]
        });

        const marker = L.marker([spot.lat, spot.lng], { icon: customIcon });
        marker.bindPopup(`
          <div style="font-family:var(--font-stack);font-size:13px;max-width:220px;padding:4px;">
            ${spot.img ? `<img src="${spot.img}" style="width:100%;height:100px;object-fit:cover;border-radius:6px;margin-bottom:6px;" alt="${spot.name}"/>` : ''}
            <b style="font-size:14px;color:var(--ink);display:block;">${idx + 1}. ${spot.name}</b>
            <div style="color:var(--muted);font-size:11.5px;margin:2px 0;">${spot.address || spot.kor || ''}</div>
            ${spot.time ? `<div style="font-size:11.5px;color:var(--body);margin-top:2px;">🕒 ${spot.time}</div>` : ''}
            ${spot.naverUrl ? `<div style="margin-top:6px;"><a href="${spot.naverUrl}" target="_blank" style="color:#007aff;font-weight:700;font-size:12px;">在 Naver Map 打开导航 →</a></div>` : ''}
          </div>
        `);
        marker.on('click', () => {
          if (window.innerWidth <= 1024) {
            showMobileMapCard(spot);
          }
        });
        markerLayer.addLayer(marker);
        currentMarkers[spot.name] = marker;

        // If this spot is a meal hub with multiple candidate restaurants:
        if (spot.meals && spot.meals.length > 0) {
          spot.meals.forEach(m => {
            if (m.lat && m.lng) {
              bounds.push([m.lat, m.lng]);

              // Draw subtle connector from the Meal Hub to candidate restaurant
              if (m.lat !== spot.lat || m.lng !== spot.lng) {
                L.polyline([[spot.lat, spot.lng], [m.lat, m.lng]], {
                  color: '#94a3b8',
                  weight: 1.5,
                  opacity: 0.6,
                  dashArray: '3, 4'
                }).addTo(routeLayer);
              }

              let mealLabel = m.name.split(' ')[0].split('(')[0];
              if (mealLabel.length > 6) mealLabel = mealLabel.substring(0, 6);

              const candidateIcon = L.divIcon({
                className: 'custom-pin-wrap',
                html: `<div class="map-pill-pin candidate">🍽️ ${mealLabel}</div>`,
                iconSize: [84, 24],
                iconAnchor: [42, 12]
              });

              const cMarker = L.marker([m.lat, m.lng], { icon: candidateIcon });
              cMarker.bindPopup(`
                <div style="font-family:var(--font-stack);font-size:13px;max-width:220px;padding:4px;">
                  ${m.img ? `<img src="${m.img}" style="width:100%;height:100px;object-fit:cover;border-radius:6px;margin-bottom:6px;" alt="${m.name}"/>` : ''}
                  <b style="font-size:14px;color:var(--ink);display:block;">🍽️ ${m.name}</b>
                  <div style="color:var(--primary);font-size:11.5px;font-weight:700;">${m.score || ''}</div>
                  <div style="color:var(--muted);font-size:11.5px;margin:2px 0;">${m.address || ''}</div>
                  ${m.hours ? `<div style="font-size:11.5px;color:var(--body);margin-top:2px;">🕒 ${m.hours}</div>` : ''}
                  ${m.memo ? `<div style="font-size:11.5px;color:var(--body);margin-top:4px;line-height:1.3;">${m.memo}</div>` : ''}
                  ${m.naverUrl ? `<div style="margin-top:6px;"><a href="${m.naverUrl}" target="_blank" style="color:#007aff;font-weight:700;font-size:12px;">在 Naver Map 打开导航 →</a></div>` : ''}
                </div>
              `);
              cMarker.on('click', () => {
                if (window.innerWidth <= 1024) {
                  showMobileMapCard(m);
                }
              });
              markerLayer.addLayer(cMarker);
              currentMarkers[m.name] = cMarker;
            }
          });
        }
      });

      // Draw the main connected route with directional arrows
      drawRouteWithArrows(mainRoutePoints, dColor);
    }
  }

  if (bounds.length > 0) {
    map.fitBounds(bounds, { padding: [40, 40], maxZoom: 15 });
  }
}

/* ═══════════════════════════════════════════
   Mobile Map Preview Floating Card Handlers
   ═══════════════════════════════════════════ */
function showMobileMapCard(item) {
  const card = document.getElementById('mobileMapCard');
  const body = document.getElementById('mobileMapCardBody');
  if (!card || !body) return;

  const imgHtml = item.img ? `<img src="${item.img}" class="mobile-map-card-img" alt="${item.name}" loading="lazy" />` : '';
  const subHtml = item.score ? `<span style="color:var(--primary);font-weight:700;">${item.score}</span> · ${item.hours || item.time || item.address || ''}` : `${item.time || item.hours || item.address || ''}`;

  body.innerHTML = `
    ${imgHtml}
    <div class="mobile-map-card-info">
      <div class="mobile-map-card-title">${item.name}</div>
      <div class="mobile-map-card-sub">${subHtml}</div>
      <div class="mobile-map-card-actions">
        ${item.naverUrl ? `<a href="${item.naverUrl}" target="_blank" class="btn-outline" style="padding:4px 10px;font-size:11px;" onclick="event.stopPropagation()">🟢 Naver 导航</a>` : ''}
        ${item.catchtable ? `<a href="https://app.catchtable.co.kr" target="_blank" class="btn-rausch" style="padding:4px 10px;font-size:11px;" onclick="event.stopPropagation()">📱 CatchTable</a>` : ''}
      </div>
    </div>
  `;

  card.classList.add('show');
}

function closeMobileMapCard(e) {
  if (e) e.stopPropagation();
  const card = document.getElementById('mobileMapCard');
  if (card) card.classList.remove('show');
}

// Focus directly on a candidate restaurant or spot on the map
function focusLocation(name, lat, lng) {
  if (!map) return;

  // On mobile, if in list view, switch seamlessly to map mode
  if (window.innerWidth <= 1024) {
    toggleMobileMap(true);
  }

  map.setView([lat, lng], 16, { animate: true });

  const m = currentMarkers[name];
  if (m) {
    setTimeout(() => {
      m.openPopup();
    }, 250);
  }

  // Also find item data to show mobile floating card
  if (window.innerWidth <= 1024) {
    const currentDay = ITINERARY_DAYS.find(x => x.id === activeDay);
    if (currentDay && currentDay.spots) {
      for (const s of currentDay.spots) {
        if (s.name === name) {
          showMobileMapCard(s);
          break;
        }
        if (s.meals) {
          const foundMeal = s.meals.find(meal => meal.name === name);
          if (foundMeal) {
            showMobileMapCard(foundMeal);
            break;
          }
        }
      }
    }
  }
}

/* ═══════════════════════════════════════════
   Tabs & Mobile Map Handlers (Airbnb Experience)
   ═══════════════════════════════════════════ */
let activeDay = 0;

function switchDay(dayId) {
  activeDay = dayId;

  const tabs = document.querySelectorAll('.nav-tab');
  tabs.forEach((tab, index) => {
    if (index === dayId) {
      tab.classList.add('active');
      // Auto-center the active tab horizontally on mobile screens
      if (typeof tab.scrollIntoView === 'function') {
        tab.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      }
    } else {
      tab.classList.remove('active');
    }
  });

  closeMobileMapCard();
  renderFeed(dayId);
  renderMapMarkers(dayId);

  // If in list view, smoothly scroll up
  if (!document.body.classList.contains('mobile-map-active')) {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else {
    // If already in mobile map mode, invalidate map size to ensure proper tile loading
    setTimeout(() => {
      if (map) map.invalidateSize();
    }, 150);
  }
}

let isMobileMapOpen = false;
function toggleMobileMap(forceState) {
  const icon = document.getElementById('mapToggleIcon');
  const text = document.getElementById('mapToggleText');

  if (typeof forceState === 'boolean') {
    isMobileMapOpen = forceState;
  } else {
    isMobileMapOpen = !isMobileMapOpen;
  }

  // Update mobile header height dynamically
  const headerEl = document.querySelector('.app-header');
  if (headerEl) {
    const h = headerEl.offsetHeight;
    document.documentElement.style.setProperty('--header-height-mobile', h + 'px');
  }

  if (isMobileMapOpen) {
    document.body.classList.add('mobile-map-active');
    if (icon) icon.textContent = '📋';
    if (text) text.textContent = '返回列表';

    setTimeout(() => {
      if (map) {
        map.invalidateSize();
        // Re-fit day bounds when opening map view
        renderMapMarkers(activeDay);
      }
    }, 100);
  } else {
    document.body.classList.remove('mobile-map-active');
    if (icon) icon.textContent = '🗺️';
    if (text) text.textContent = '查看地图';
    closeMobileMapCard();
  }
}

// Window resize listener to sync header height & reset state if expanding to desktop
window.addEventListener('resize', () => {
  if (window.innerWidth > 1024) {
    document.body.classList.remove('mobile-map-active');
    closeMobileMapCard();
  } else {
    const headerEl = document.querySelector('.app-header');
    if (headerEl) {
      document.documentElement.style.setProperty('--header-height-mobile', headerEl.offsetHeight + 'px');
    }
  }
  if (map) map.invalidateSize();
});

// Initial Bootstrap
document.addEventListener('DOMContentLoaded', () => {
  initMap();
  switchDay(0);
});
