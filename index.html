<style>
/* ═══════════════════════════════════════════
   Design Tokens — Clean, Photo-First Travel Guide
   ═══════════════════════════════════════════ */
:root {
  --primary:        #ff385c; /* Rausch Accent */
  --primary-hover:  #e00b41;
  --ink:            #222222;
  --body:           #484848;
  --muted:          #717171;
  --hairline:       #ebebeb;
  --canvas:         #ffffff;
  --surface-soft:   #f7f7f7;
  --shadow-card:    rgba(0,0,0,0.04) 0 1px 3px 0, rgba(0,0,0,0.06) 0 4px 12px 0;
  --shadow-hover:   rgba(0,0,0,0.08) 0 6px 20px 0, rgba(0,0,0,0.12) 0 10px 28px 0;
  --radius-sm:      8px;
  --radius-md:      14px;
  --radius-full:    9999px;
  --font-stack:     -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", sans-serif;
  --safe-bottom:    env(safe-area-inset-bottom, 0px);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font-stack);
  background: var(--canvas);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  line-height: 1.45;
}
a { color: inherit; text-decoration: none; }

/* ── Clean Travel Header ── */
.app-header {
  position: sticky; top: 0; z-index: 1000;
  background: #ffffff;
  border-bottom: 1px solid var(--hairline);
  box-shadow: 0 2px 8px rgba(0,0,0,0.03);
}
.header-top {
  max-width: 1320px; margin: 0 auto;
  padding: 14px 20px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
}
.trip-title-group h1 {
  font-size: 20px; font-weight: 800; color: var(--ink); letter-spacing: -0.4px;
  display: flex; align-items: center; gap: 8px;
}
.trip-title-group .trip-dates {
  font-size: 13px; font-weight: 600; color: var(--muted); margin-top: 2px;
}

/* Flight & Basecamp Summary Badges */
.header-meta-group {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.meta-chip {
  background: var(--surface-soft); border: 1px solid var(--hairline);
  border-radius: var(--radius-full); padding: 5px 12px;
  font-size: 12px; font-weight: 600; color: var(--body);
  display: flex; align-items: center; gap: 6px;
}
.meta-chip b { color: var(--ink); }

/* ── Day Navigation Strip ── */
.nav-strip-wrapper {
  background: #ffffff;
  border-top: 1px solid var(--hairline);
}
.nav-strip {
  max-width: 1320px; margin: 0 auto;
  display: flex; gap: 10px; padding: 10px 20px;
  overflow-x: auto; scrollbar-width: none;
}
.nav-strip::-webkit-scrollbar { display: none; }
.nav-tab {
  display: flex; align-items: center; gap: 6px;
  background: var(--surface-soft); border: 1px solid var(--hairline);
  border-radius: var(--radius-full); padding: 8px 16px;
  font-family: inherit; font-size: 13px; font-weight: 700;
  color: var(--muted); cursor: pointer; white-space: nowrap;
  transition: all 0.15s ease;
}
.nav-tab:hover { background: #ebebeb; color: var(--ink); }
.nav-tab.active {
  background: var(--ink); color: #ffffff;
  border-color: var(--ink);
}
.nav-tab.active .tab-icon { transform: scale(1.1); }

/* ── Main Layout: Listing Feed + Sticky Map ── */
.main-wrapper {
  max-width: 1320px; margin: 0 auto;
  padding: 20px;
  display: grid; grid-template-columns: 1fr 480px; gap: 28px;
  min-height: calc(100vh - 130px);
}
@media (max-width: 1024px) {
  .main-wrapper { grid-template-columns: 1fr; padding: 16px; gap: 16px; }
  #map-container { display: none; }
  #map-container.mobile-show { display: block; height: 380px; position: sticky; top: 120px; }
  .mobile-map-toggle { display: flex !important; }
}

/* ── Sticky Map Container ── */
#map-container {
  position: sticky; top: 124px; height: calc(100vh - 150px);
  border-radius: var(--radius-md); overflow: hidden;
  border: 1px solid var(--hairline);
  box-shadow: var(--shadow-card);
}
#map { width: 100%; height: 100%; }

/* Mobile Map Toggle Button */
.mobile-map-toggle {
  display: none; position: fixed; bottom: calc(20px + var(--safe-bottom));
  left: 50%; transform: translateX(-50%);
  background: var(--ink); color: #fff;
  padding: 12px 22px; border-radius: var(--radius-full);
  font-size: 14px; font-weight: 700;
  box-shadow: 0 4px 18px rgba(0,0,0,0.3);
  z-index: 1001; cursor: pointer;
  align-items: center; gap: 8px;
}

/* ── Feed Section ── */
.feed-header { margin-bottom: 20px; }
.feed-header h2 { font-size: 22px; font-weight: 800; color: var(--ink); letter-spacing: -0.3px; }
.feed-header p { font-size: 14px; color: var(--muted); margin-top: 4px; }

.feed-list { display: flex; flex-direction: column; gap: 20px; }

/* ── Spot Card (Photo-First & Directly Clickable) ── */
.spot-card {
  background: #ffffff;
  border-radius: var(--radius-md);
  border: 1px solid var(--hairline);
  box-shadow: var(--shadow-card);
  overflow: hidden;
  transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
}
.spot-card.clickable {
  cursor: pointer;
}
.spot-card.clickable:hover {
  box-shadow: var(--shadow-hover);
  transform: translateY(-2px);
  border-color: #c7d2fe;
}
.spot-card.clickable:active {
  transform: scale(0.995);
}

/* Card Photo Banner */
.card-media {
  position: relative; width: 100%; height: 230px;
  background: #f0f0f0; overflow: hidden;
}
.card-media img {
  width: 100%; height: 100%; object-fit: cover;
  transition: transform 0.3s ease;
}
.spot-card.clickable:hover .card-media img {
  transform: scale(1.02);
}

/* Badges over photo */
.badge-float-left {
  position: absolute; top: 14px; left: 14px;
  background: rgba(255,255,255,0.96); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  padding: 4px 12px; border-radius: var(--radius-full);
  font-size: 12px; font-weight: 700; color: var(--ink);
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  display: flex; align-items: center; gap: 4px;
}
.badge-float-left.highlight {
  background: #fff8e6; color: #b78103; border: 1px solid #ffe58f;
}
.time-pill-float {
  position: absolute; bottom: 12px; left: 14px;
  background: rgba(34,34,34,0.88); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  color: #fff; font-size: 12px; font-weight: 700;
  padding: 4px 10px; border-radius: 6px;
}

/* Card Body */
.card-body { padding: 18px; }

.card-title-row {
  display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
}
.card-title {
  font-size: 18px; font-weight: 800; color: var(--ink); line-height: 1.3;
}
.card-kor-name {
  font-size: 13px; font-weight: 600; color: var(--muted); margin-top: 2px;
}
.card-address {
  font-size: 12px; color: var(--muted); margin-top: 4px;
  display: flex; align-items: center; gap: 4px;
}

/* Meta Pills */
.meta-pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
.pill {
  font-size: 12px; font-weight: 600; padding: 4px 10px;
  border-radius: 6px; display: inline-flex; align-items: center; gap: 4px;
}
.pill.transit { background: #f0f5ff; color: #007aff; }
.pill.hours   { background: #f6ffed; color: #389e0d; border: 1px solid #d9f7be; }
.pill.reserve { background: #fff0f0; color: #e02020; border: 1px solid #ffccc7; }

.card-desc {
  font-size: 13.5px; color: var(--body); line-height: 1.5; margin-top: 8px;
}

/* ── Meal Candidate Options (Directly Clickable to Locate) ── */
.meal-section {
  margin-top: 14px; border-top: 1px solid var(--hairline); padding-top: 14px;
}
.meal-section-head {
  font-size: 13px; font-weight: 800; color: var(--ink); text-transform: uppercase;
  letter-spacing: 0.5px; margin-bottom: 10px; display: flex; justify-content: space-between;
}
.meal-cards-list { display: flex; flex-direction: column; gap: 10px; }

.meal-item {
  background: var(--surface-soft); border-radius: var(--radius-sm);
  padding: 12px 14px; border: 1px solid var(--hairline);
  display: flex; gap: 14px; align-items: flex-start;
  transition: all 0.15s ease;
  cursor: pointer;
}
.meal-item:hover {
  background: #ffffff;
  border-color: #c7d2fe;
  box-shadow: 0 4px 14px rgba(0,0,0,0.06);
  transform: translateY(-1px);
}
.meal-item:active {
  transform: scale(0.99);
}
.meal-item.top-rank {
  background: #fffdf9; border-left: 4px solid var(--primary);
  border-color: #ffd8d8;
}
.meal-item.top-rank:hover {
  background: #ffffff;
  border-color: var(--primary);
}
.meal-item-thumb {
  width: 84px; height: 84px; border-radius: 8px; object-fit: cover;
  background: #eee; flex-shrink: 0;
}
.meal-item-content { flex: 1; min-width: 0; }
.meal-name-row {
  display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 4px;
}
.meal-name { font-size: 15px; font-weight: 800; color: var(--ink); }
.meal-score { font-size: 12px; font-weight: 800; color: var(--primary); }
.meal-address { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.meal-memo { font-size: 13px; color: var(--body); margin-top: 4px; line-height: 1.4; }
.meal-meta-row {
  font-size: 11.5px; color: var(--muted); margin-top: 6px;
  display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
}
.meal-actions-row {
  display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap;
}

/* Button Styles */
.btn-rausch {
  padding: 5px 12px; border-radius: 6px;
  background: var(--primary); color: #fff;
  font-size: 11.5px; font-weight: 700;
  border: none; cursor: pointer; text-align: center;
  display: inline-flex; align-items: center; gap: 4px;
}
.btn-rausch:hover { background: var(--primary-hover); }
.btn-outline {
  padding: 5px 12px; border-radius: 6px;
  background: #fff; color: var(--ink);
  font-size: 11.5px; font-weight: 700;
  border: 1px solid #c7c7c7; cursor: pointer; text-align: center;
  display: inline-flex; align-items: center; gap: 4px;
}
.btn-outline:hover { background: #f0f0f0; border-color: var(--ink); }

/* Card Footer Actions */
.card-bottom-actions {
  display: flex; gap: 8px; margin-top: 14px; padding-top: 12px;
  border-top: 1px solid var(--hairline); flex-wrap: wrap;
}

/* Overview Stat Cards */
.overview-stats {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 24px;
}
.stat-box {
  background: #ffffff; border: 1px solid var(--hairline);
  border-radius: var(--radius-md); padding: 16px; box-shadow: var(--shadow-card);
}
.stat-box .stat-label { font-size: 11.5px; font-weight: 800; color: var(--muted); text-transform: uppercase; }
.stat-box .stat-val { font-size: 15px; font-weight: 800; color: var(--ink); margin-top: 6px; }
.stat-box .stat-sub { font-size: 12.5px; color: var(--muted); margin-top: 4px; line-height: 1.4; }

/* ── Custom Leaflet Map Pin Style ── */
.map-pill-pin {
  background: #ffffff; color: var(--ink);
  font-weight: 800; font-size: 11.5px;
  padding: 4px 8px; border-radius: 20px;
  border: 1px solid rgba(0,0,0,0.16);
  box-shadow: 0 2px 8px rgba(0,0,0,0.18);
  white-space: nowrap; cursor: pointer;
  transition: transform 0.15s, background 0.15s, color 0.15s;
  display: flex; align-items: center; gap: 4px;
}
.map-pill-pin:hover, .map-pill-pin.active {
  background: var(--ink); color: #ffffff;
  transform: scale(1.12); z-index: 1000;
}
.map-pill-pin.rausch {
  background: var(--primary); color: #ffffff; border: none;

/* ═══════════════════════════════════════════
   Leaflet Map Controller with Dynamic Focus
   ═══════════════════════════════════════════ */
let map;
let markerLayer;
let currentMarkers = {};

function initMap() {
  map = L.map('map', {
    zoomControl: true,
    attributionControl: false
  }).setView([37.565, 126.985], 13);

  // High-clarity clean CartoDB Voyager tiles
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    maxZoom: 19
  }).addTo(map);

  markerLayer = L.featureGroup().addTo(map);
}

function renderMapMarkers(dayId) {
  if (!markerLayer) return;
  markerLayer.clearLayers();
  currentMarkers = {};

  let bounds = [];
  const spotsToRender = [];

  if (dayId === 0) {
    for (let i = 1; i < ITINERARY_DAYS.length; i++) {
      ITINERARY_DAYS[i].spots.forEach(s => spotsToRender.push({ ...s, isCandidate: false }));
    }
  } else {
    const d = ITINERARY_DAYS.find(x => x.id === dayId);
    if (d && d.spots) {
      d.spots.forEach(s => {
        spotsToRender.push({ ...s, isCandidate: false });
        if (s.meals && s.meals.length > 0) {
          s.meals.forEach(m => {
            if (m.lat && m.lng) {
              spotsToRender.push({
                name: m.name,
                kor: m.name,
                lat: m.lat,
                lng: m.lng,
                address: m.address,
                img: m.img,
                time: m.hours,
                badge: m.score,
                isCandidate: true,
                naverUrl: m.naverUrl
              });
            }
          });
        }
      });
    }
  }

  spotsToRender.forEach(spot => {
    if (!spot.lat || !spot.lng) return;

    const isHighlight = spot.badge && (spot.badge.includes('岩馆') || spot.badge.includes('必买') || spot.badge.includes('必逛') || spot.badge.includes('🥇'));
    let pillClass = 'map-pill-pin';
    if (spot.isCandidate) pillClass += ' candidate';
    else if (isHighlight) pillClass += ' rausch';

    let shortLabel = spot.name.split(' ')[0].split('(')[0];
    if (shortLabel.length > 7) shortLabel = shortLabel.substring(0, 7);

    const customIcon = L.divIcon({
      className: 'custom-pin-wrap',
      html: `<div class="${pillClass}">${spot.isCandidate ? '🍽️ ' : ''}${shortLabel}</div>`,
      iconSize: [84, 26],
      iconAnchor: [42, 13]
    });

    const marker = L.marker([spot.lat, spot.lng], { icon: customIcon });
    
    marker.bindPopup(`
      <div style="font-family:var(--font-stack);font-size:13px;max-width:220px;padding:4px;">
        ${spot.img ? `<img src="${spot.img}" style="width:100%;height:100px;object-fit:cover;border-radius:6px;margin-bottom:6px;" alt="${spot.name}"/>` : ''}
        <b style="font-size:14px;color:var(--ink);display:block;">${spot.name}</b>
        <div style="color:var(--muted);font-size:11.5px;margin:2px 0;">${spot.address || spot.kor || ''}</div>
        ${spot.time ? `<div style="font-size:11.5px;color:var(--body);margin-top:2px;">🕒 ${spot.time}</div>` : ''}
        ${spot.naverUrl ? `<div style="margin-top:6px;"><a href="${spot.naverUrl}" target="_blank" style="color:#007aff;font-weight:700;font-size:12px;">在 Naver Map 打开导航 →</a></div>` : ''}
      </div>
    `);

    markerLayer.addLayer(marker);
    currentMarkers[spot.name] = marker;
    bounds.push([spot.lat, spot.lng]);
  });

  if (bounds.length > 0) {
    map.fitBounds(bounds, { padding: [40, 40], maxZoom: 15 });
  }
}

// Focus directly on a candidate restaurant or spot on the map
function focusLocation(name, lat, lng) {
  if (!map) return;

  // On mobile, if map is hidden, show it
  const mapContainer = document.getElementById('map-container');
  if (window.innerWidth <= 1024 && !mapContainer.classList.contains('mobile-show')) {
    toggleMobileMap();
  }

  map.setView([lat, lng], 16, { animate: true });

  const m = currentMarkers[name];
  if (m) {
    setTimeout(() => m.openPopup(), 250);
  }
}

/* ═══════════════════════════════════════════
   Feed Renderer
   ═══════════════════════════════════════════ */

    let html = `

        <div class="stat-box">
          <div class="stat-label">✈️ 往返航班</div>
          <div class="stat-val">去 9/12(六) OZ3625 (14:00 GMP)<br>回 9/15(二) OZ367 (20:00 ICN)</div>
          <div class="stat-sub">最后一天15:15出发，预留近4小时采购</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">🏨 住宿大本营</div>
          <div class="stat-val">더스퀘어 호스텔 (The Square)</div>
          <div class="stat-sub">钟路三街站旁，步行2分钟即达各大岩馆</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">🧗 抱石打卡</div>
          <div class="stat-val">PEAKERS 钟路店 (影院改造)<br>Seoul Forest 圣水店 (首尔林)</div>
          <div class="stat-sub">周六室内爬岩 + 周一错峰圣水洞</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">👕 潮流逛街</div>
          <div class="stat-val">KT&G 想象空间 / BADBLOOD<br>탄산 마그네슘 (攀岩主题店)</div>
          <div class="stat-sub">弘大文创 + 合井辣妹机能 + 圣水岩壁潮店</div>
        </div>
      </div>
      <h3 style="font-size:18px;font-weight:800;margin:18px 0 12px;">四天精选行程一览 (点击查看详情)</h3>
    `;

    for (let i = 1; i < ITINERARY_DAYS.length; i++) {
      const d = ITINERARY_DAYS[i];
      const previewImg = d.spots.find(s => s.img)?.img || OFFICIAL_DATA.hostel.img;
      html += `
        <article class="spot-card" onclick="switchDay(${d.id})" style="cursor:pointer;">
          <div class="card-media" style="height:190px;">
            <img src="${previewImg}" alt="${d.label}" loading="lazy" />
            <div class="badge-float-left">📅 ${d.date}</div>
            <div class="time-pill-float">${d.label}</div>
          </div>
          <div class="card-body">
            <div class="card-title-row">
              <div class="card-title">${d.label}</div>
              <div style="font-weight:800;color:var(--primary);font-size:13px;">查看行程与地图 →</div>
            </div>
            <div class="card-desc">${d.title}</div>
          </div>
        </article>
      `;
    }
    container.innerHTML = html;
  } else {
    const d = ITINERARY_DAYS.find(x => x.id === dayId);
    if (!d) return;

    titleEl.textContent = `${d.label} · ${d.date}`;
    subEl.textContent = d.title;

    let html = '';
    d.spots.forEach(spot => {
      let mealsHtml = '';
      if (spot.meals && spot.meals.length > 0) {
        mealsHtml += `
          <div class="meal-section">
            <div class="meal-section-head">
              <span>🍽️ 候选正餐精选 (Naver 官方实拍 & 地图精确定位)</span>
            </div>
            <div class="meal-cards-list">
        `;
        spot.meals.forEach(m => {
          mealsHtml += `
            <div class="meal-item ${m.top ? 'top-rank' : ''}" onclick="event.stopPropagation(); focusLocation('${m.name.replace(/'/g, "\\'")}', ${m.lat}, ${m.lng})">
              <img src="${m.img}" class="meal-item-thumb" alt="${m.name}" loading="lazy" />
              <div class="meal-item-content">
                <div class="meal-name-row">
                  <div class="meal-name">${m.name}</div>
                  <div class="meal-score">${m.score}</div>
                </div>
                <div class="meal-address">📍 ${m.address}</div>
                <div class="meal-memo">${m.memo}</div>
                <div class="meal-meta-row">
                  <span>🕒 ${m.hours}</span>
                  <span style="color:var(--ink);font-weight:700;">💰 ${m.budget}</span>
                  ${m.booking ? `<span style="color:#e02020;font-weight:700;">${m.booking}</span>` : ''}
                </div>
                <div class="meal-actions-row">
                  ${m.catchtable ? `<a href="https://app.catchtable.co.kr" target="_blank" class="btn-rausch" onclick="event.stopPropagation()">📱 CatchTable 预约/取号</a>` : ''}
                  ${m.naverUrl ? `<a href="${m.naverUrl}" target="_blank" class="btn-outline" onclick="event.stopPropagation()">🟢 Naver Map</a>` : ''}
                </div>
              </div>
            </div>
          `;
        });
        mealsHtml += `</div></div>`;
      }

      // Airport cards have NO image banner, only a clean header
      const mediaHtml = spot.img ? `
        <div class="card-media">
          <img src="${spot.img}" alt="${spot.name}" loading="lazy" />
          <div class="badge-float-left ${spot.badge?.includes('首选') || spot.badge?.includes('必买') || spot.badge?.includes('必逛') ? 'highlight' : ''}">
            ${spot.badge || '精选打卡'}
          </div>
          <div class="time-pill-float">🕒 ${spot.time}</div>
        </div>
      ` : `
        <div style="padding: 16px 18px 0; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
          <span class="badge-float-left" style="position:static;box-shadow:none;background:var(--surface-soft);border:1px solid var(--hairline);">${spot.badge || '航班'}</span>
          <span style="font-size:12px;font-weight:700;color:var(--muted);">🕒 ${spot.time}</span>
        </div>
      `;

      const isClickable = spot.lat && spot.lng;
      const cardClickAttr = isClickable ? `onclick="focusLocation('${spot.name.replace(/'/g, "\\'")}', ${spot.lat}, ${spot.lng})"` : '';
      const cardClass = isClickable ? 'spot-card clickable' : 'spot-card';

      html += `
        <article class="${cardClass}" ${cardClickAttr}>
          ${mediaHtml}
          <div class="card-body">
            <div class="card-title-row">
              <div>
                <h3 class="card-title">${spot.name}</h3>
                <div class="card-kor-name">${spot.kor || ''}</div>
              </div>
            </div>

            ${spot.address ? `<div class="card-address">📍 ${spot.address}</div>` : ''}

            <div class="meta-pills">
              ${spot.transit ? `<span class="pill transit">${spot.transit}</span>` : ''}
              ${spot.hours ? `<span class="pill hours">${spot.hours}</span>` : ''}
            </div>

            ${spot.desc ? `<div class="card-desc">${spot.desc}</div>` : ''}

            ${mealsHtml}

            <div class="card-bottom-actions">
              ${spot.naverUrl ? `<a href="${spot.naverUrl}" target="_blank" class="btn-outline" onclick="event.stopPropagation()">🟢 打开 Naver Map 导航</a>` : ''}
              <a href="https://www.xiaohongshu.com/explore?keyword=${encodeURIComponent(spot.name)}" target="_blank" class="btn-outline" onclick="event.stopPropagation()">📕 小红书实拍与攻略</a>
            </div>
          </div>
        </article>
      `;
    });

    container.innerHTML = html;
  }
}

/* ═══════════════════════════════════════════
   Tabs & Mobile Map Handlers
   ═══════════════════════════════════════════ */
let activeDay = 0;

function switchDay(dayId) {
  activeDay = dayId;

  const tabs = document.querySelectorAll('.nav-tab');
  tabs.forEach((tab, index) => {
    if (index === dayId) tab.classList.add('active');
    else tab.classList.remove('active');
  });

  renderFeed(dayId);
  renderMapMarkers(dayId);

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

let isMobileMapOpen = false;
function toggleMobileMap() {
  const mapContainer = document.getElementById('map-container');
  const icon = document.getElementById('mapToggleIcon');
  const text = document.getElementById('mapToggleText');

  isMobileMapOpen = !isMobileMapOpen;
  if (isMobileMapOpen) {
    mapContainer.classList.add('mobile-show');
    icon.textContent = '📋';
    text.textContent = '返回列表';
    setTimeout(() => map.invalidateSize(), 200);
  } else {
    mapContainer.classList.remove('mobile-show');
    icon.textContent = '🗺️';
    text.textContent = '查看地图';
  }
}

// Initial Bootstrap
document.addEventListener('DOMContentLoaded', () => {
  initMap();
  switchDay(0);
});
</script>
